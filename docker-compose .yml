services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noderegistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noderegistry}
      POSTGRES_DB: ${POSTGRES_DB:-noderegistry}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noderegistry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  node-1:
    build: .
    restart: unless-stopped
    environment:
      NODE_ID: "1"
      PEERS: "http://node-2:8080,http://node-3:8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-noderegistry}:${POSTGRES_PASSWORD:-noderegistry}@db:5432/${POSTGRES_DB:-noderegistry}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  node-2:
    build: .
    restart: unless-stopped
    environment:
      NODE_ID: "2"
      PEERS: "http://node-1:8080,http://node-3:8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-noderegistry}:${POSTGRES_PASSWORD:-noderegistry}@db:5432/${POSTGRES_DB:-noderegistry}
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  node-3:
    build: .
    restart: unless-stopped
    environment:
      NODE_ID: "3"
      PEERS: "http://node-1:8080,http://node-2:8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-noderegistry}:${POSTGRES_PASSWORD:-noderegistry}@db:5432/${POSTGRES_DB:-noderegistry}
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
